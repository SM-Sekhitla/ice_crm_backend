services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - crm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL for the Compose db service}
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL for the Compose db service}
      APP_HOST: 0.0.0.0
      APP_PORT: ${APP_PORT:-5002}
    ports:
      - "127.0.0.1:${APP_PORT:-5002}:${APP_PORT:-5002}"
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL for the Compose db service}
    command: python -m app.services.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  crm_data:
